<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16233A">
<title>Facturador</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root {
    --ink: #16233A; --ink-soft: #3C4A5E; --muted: #6B7686; --paper: #FDFCFA; --panel: #F5F4F0;
    --line: #E1DFD8; --brass: #7C5F2C; --gold: #C9A45C; --red: #A23B3B; --green: #2F6F4E; --amber: #8A5A00;
    --card: #fff; --bar: #2B4C7E; --bar-hover: #16233A;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink);
    font: 16px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  h1, h2, h3 { font-family: Georgia, "Times New Roman", serif; margin: 0; }
  h2 { font-size: 1.35rem; }
  h3 { font-size: 1.05rem; margin-bottom: 10px; }
  .muted { color: var(--ink-soft); font-size: .9rem; }
  .hidden { display: none !important; }

  header.top { position: sticky; top: 0; z-index: 10; background: var(--ink); color: #fff;
    padding: calc(10px + env(safe-area-inset-top)) 16px 0; }
  header.top .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  header.top h1 { font-size: 1.2rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header.top .who { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
  header.top .who button { background: transparent; border: 1px solid #ffffff55; color: #fff;
    border-radius: 6px; padding: 4px 10px; font-size: .85rem; cursor: pointer; max-width: 160px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  nav.tabs { display: flex; gap: 4px; overflow-x: auto; margin-top: 8px; scrollbar-width: none; }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs button { flex: 0 0 auto; background: transparent; border: 0; color: #ffffffb0;
    padding: 10px 12px; border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
  nav.tabs button.active { color: #fff; border-bottom-color: var(--gold); font-weight: 600; }

  main { max-width: 900px; margin: 0 auto; padding: 16px 16px 96px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  .toolbar { display: flex; gap: 8px; align-items: center; margin: 12px 0; flex-wrap: wrap; }
  .toolbar input[type=search] { flex: 1 1 180px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 12px; }
  .chip { border: 1px solid var(--line); background: #fff; border-radius: 99px; padding: 6px 12px; cursor: pointer; font-size: .9rem; }
  .chip.active { background: var(--ink); border-color: var(--ink); color: #fff; }

  label.f { display: block; margin-bottom: 12px; }
  label.f > span { display: block; font-size: .85rem; color: var(--ink-soft); margin-bottom: 4px; }
  input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
    background: #fff; min-height: 44px; }
  input[type=checkbox] { width: auto; min-height: 0; }
  input:focus, select:focus, textarea:focus { outline: 2px solid #C9A45C66; border-color: var(--gold); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  @media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px;
    padding: 0 16px; border-radius: 8px; border: 1px solid var(--line); background: #fff; cursor: pointer; text-decoration: none; }
  .btn.primary { background: var(--ink); border-color: var(--ink); color: #fff; font-weight: 600; }
  .btn.danger { color: var(--red); border-color: #E7C3BE; }
  .btn.good { color: var(--green); border-color: #BFD8C9; }
  .btn.small { min-height: 36px; padding: 0 12px; font-size: .9rem; }
  .btn.block { width: 100%; }
  .btn:disabled { opacity: .6; cursor: progress; }
  .linkbtn { background: none; border: 0; color: var(--ink-soft); text-decoration: underline; cursor: pointer; padding: 8px 0; font-size: .9rem; }

  ul.list { list-style: none; margin: 0; padding: 0; }
  ul.list li { display: flex; justify-content: space-between; gap: 10px; align-items: center;
    padding: 12px 4px; border-bottom: 1px solid var(--line); }
  ul.list li:last-child { border-bottom: 0; }
  ul.list .main { min-width: 0; flex: 1; }
  ul.list .title { font-weight: 600; overflow-wrap: anywhere; }
  ul.list .actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  ul.list li.voided .title { text-decoration: line-through; color: var(--muted); }
  @media (max-width: 560px) { ul.list li { flex-wrap: wrap; } ul.list .actions { width: 100%; justify-content: flex-start; } }
  .empty { text-align: center; color: var(--ink-soft); padding: 28px 8px; display: block !important; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: .78rem; background: var(--panel); color: var(--ink-soft); white-space: nowrap; }
  .badge.low, .badge.pendiente, .badge.anulada { background: #FBEEEC; color: var(--red); }
  .badge.abono { background: #FFF4DC; color: var(--amber); }
  .badge.pagada { background: #E8F3EC; color: var(--green); }
  .badge.devuelta { background: #EEF0F4; color: var(--ink-soft); }
  .neg { color: var(--red) !important; }
  .pos { color: var(--green) !important; }
  .badge.admin { background: #EEE8DA; color: var(--brass); }

  .line-item { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 10px; background: #fff; }
  .line-item .nums { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 8px; }
  .line-item .nums label.f { margin-bottom: 0; }
  .line-item .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
  .money { font-family: ui-monospace, Consolas, monospace; }
  .totals { background: var(--panel); border-radius: 8px; padding: 12px 16px; margin: 14px 0; }
  .totals div { display: flex; justify-content: space-between; padding: 3px 0; gap: 12px; }
  .totals .grand { font-weight: 700; font-size: 1.15rem; border-top: 1px solid var(--line); margin-top: 6px; padding-top: 8px; }
  .errors { background: #FBEEEC; border: 1px solid #E7C3BE; color: #7A2E2E; border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; }
  .errors ul { margin: 6px 0 0; padding-left: 18px; }
  .note { background: var(--panel); border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; font-size: .9rem; color: var(--ink-soft); }
  .client-info { font-size: .9rem; color: var(--ink-soft); white-space: pre-line; margin: -4px 0 12px; }
  .logo-prev { max-width: 180px; max-height: 80px; display: block; margin: 6px 0 10px; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 12px; }
  .seg label { flex: 1; text-align: center; padding: 10px 6px; cursor: pointer; font-size: .95rem; }
  .seg input { display: none; }
  .seg label:has(input:checked) { background: var(--ink); color: #fff; font-weight: 600; }

  table.t { width: 100%; border-collapse: collapse; font-size: .92rem; }
  table.t th { text-align: left; font-weight: 600; color: var(--ink-soft); font-size: .8rem; text-transform: uppercase;
    letter-spacing: .03em; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  table.t td { padding: 8px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.t tr:last-child td { border-bottom: 0; }
  table.t .r { text-align: right; white-space: nowrap; }

  /* resumen */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .tile .k { font-size: .8rem; color: var(--ink-soft); }
  .tile .v { font-size: clamp(.95rem, 4vw, 1.35rem); font-weight: 700; margin-top: 2px; font-family: ui-monospace, Consolas, monospace; white-space: nowrap; }
  .tile .s { font-size: .8rem; color: var(--muted); margin-top: 2px; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: 220px; overflow: visible; }
  .chart .bar { fill: var(--bar); }
  .chart .hit:hover + .bar, .chart .bar.on { fill: var(--bar-hover); }
  .chart .grid line { stroke: var(--line); stroke-width: 1; }
  .chart text { fill: var(--muted); font-size: 11px; }
  .chart .tip { position: absolute; pointer-events: none; background: var(--ink); color: #fff; border-radius: 6px;
    padding: 6px 10px; font-size: .85rem; white-space: nowrap; transform: translate(-50%, -100%); margin-top: -8px; }

  dialog { border: 0; border-radius: 12px; padding: 0; width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 40px); }
  dialog::backdrop { background: #16233A88; }
  dialog form { padding: 18px; }
  dialog h2 { margin-bottom: 14px; }
  dialog .btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; flex-wrap: wrap; }

  #toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 8px; max-width: calc(100vw - 32px);
    box-shadow: 0 4px 16px #0003; z-index: 100; }
  #toast.error { background: var(--red); }

  #login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  #login .card { width: 100%; max-width: 380px; }
  #login h1 { margin-bottom: 4px; }
</style>
</head>
<body>

<section id="login" class="hidden">
  <form class="card" id="login-form">
    <h1>Facturador</h1>
    <p class="muted" id="login-hint">Entra con tu usuario y contraseña.</p>
    <label class="f" id="login-user-wrap"><span>Usuario</span>
      <input id="login-user" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
    <label class="f"><span id="login-pass-label">Contraseña</span>
      <input type="password" id="login-pass" autocomplete="current-password" required></label>
    <div id="login-error" class="errors hidden"></div>
    <button class="btn primary block" type="submit">Entrar</button>
    <button class="linkbtn" type="button" id="login-mode">Entrar con la clave maestra (dueño)</button>
  </form>
</section>

<div id="app" class="hidden">
  <header class="top">
    <div class="row">
      <h1 id="company-title">Facturador</h1>
      <div class="who"><button id="me" title="Mi cuenta"></button><button id="logout">Salir</button></div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main id="view"></main>
</div>

<dialog id="modal"><form method="dialog" id="modal-form"></form></dialog>
<div id="toast" class="hidden"></div>

<script>
"use strict";
const AUTH_STORAGE = "facturador_auth";
const PAYMENT_METHODS = [["efectivo", "Efectivo"], ["transferencia", "Transferencia"], ["tarjeta", "Tarjeta"], ["otro", "Otro"]];
const METHOD_LABEL = Object.fromEntries(PAYMENT_METHODS);
const STATUS_LABEL = { pagada: "Pagada", abono: "Abono", pendiente: "Pendiente", anulada: "Anulada", sin_registro: "Sin registro de pago", devuelta: "Devuelta" };
const ALL_TABS = [
  ["resumen", "Resumen", true], ["factura", "Nueva factura"], ["historial", "Historial"], ["caja", "Caja"], ["clientes", "Clientes"],
  ["productos", "Productos"], ["compras", "Compras", true], ["proveedores", "Proveedores", true], ["gastos", "Gastos"],
  ["empresa", "Mi empresa", true], ["usuarios", "Usuarios", true], ["actividad", "Actividad", true],
];
let auth = null;      // {mode: "token"|"key", secret, user}
let company = {};
let currentTab = null;

// ---------- utilidades ----------
const $ = (sel, root = document) => root.querySelector(sel);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = (v) => { const n = parseFloat(String(v ?? "").replace(",", ".")); return Number.isFinite(n) ? n : null; };
const fmtNum = (n) => (n ?? 0).toLocaleString("es", { maximumFractionDigits: 3 });
const money = (v) => `${company.currency || "$"} ${(Number(v) || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
const fmtDate = (ts) => ts ? new Date(ts * 1000).toLocaleDateString("es", { day: "2-digit", month: "2-digit", year: "numeric" }) : "";
const fmtDateTime = (ts) => ts ? new Date(ts * 1000).toLocaleString("es", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "";
const isAdmin = () => auth?.user?.role === "admin";
const badge = (status) => `<span class="badge ${esc(status)}">${esc(STATUS_LABEL[status] || status)}</span>`;

function storageGet() { try { return JSON.parse(localStorage.getItem(AUTH_STORAGE) || "null"); } catch { return null; } }
function storageSet(v) { try { v ? localStorage.setItem(AUTH_STORAGE, JSON.stringify(v)) : localStorage.removeItem(AUTH_STORAGE); } catch {} }

let toastTimer;
function toast(msg, error = false) {
  const t = $("#toast");
  t.textContent = msg; t.className = error ? "error" : "";
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add("hidden"), 3800);
}

class ApiError extends Error {}

function authHeaders(a = auth) {
  if (!a) return {};
  return a.mode === "key" ? { "X-API-Key": a.secret } : { Authorization: `Bearer ${a.secret}` };
}

async function api(method, path, body, { raw = false } = {}) {
  let r;
  try {
    r = await fetch(path, {
      method,
      headers: { ...authHeaders(), ...(body !== undefined ? { "Content-Type": "application/json" } : {}) },
      body: body !== undefined ? JSON.stringify(body) : undefined,
    });
  } catch {
    throw new ApiError("No se pudo conectar con el servidor. Revisa tu conexión a internet.");
  }
  if (r.status === 401) { logout("Tu sesión terminó. Vuelve a entrar."); throw new ApiError("Sesión vencida."); }
  if (!r.ok) {
    let detail = r.statusText;
    try { detail = (await r.json()).error || detail; } catch {}
    throw new ApiError(detail);
  }
  return raw ? r : r.json();
}

async function guarded(fn) {
  try { return await fn(); }
  catch (e) { toast(e.message || String(e), true); }
}

// ---------- modal genérico ----------
// fields: [{name, label, type, required, options:[{value,label}], placeholder, default, validate, help}]
function openForm(title, fields, values = {}, submitLabel = "Guardar", intro = "") {
  return new Promise((resolve) => {
    const dlg = $("#modal"), form = $("#modal-form");
    form.innerHTML = `<h2>${esc(title)}</h2>${intro}` + fields.map((f) => {
      const v = values[f.name] ?? f.default ?? "";
      let input;
      if (f.type === "select") {
        input = `<select name="${f.name}">${f.options.map((o) =>
          `<option value="${esc(o.value)}" ${String(o.value) === String(v) ? "selected" : ""}>${esc(o.label)}</option>`).join("")}</select>`;
      } else if (f.type === "checkbox") {
        return `<label class="f" style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="${f.name}" ${v ? "checked" : ""}> ${esc(f.label)}</label>`;
      } else {
        const t = f.type || "text";
        input = `<input name="${f.name}" type="${t}" value="${esc(v)}" ${f.required ? "required" : ""}
          ${t === "number" ? `step="any" inputmode="decimal"` : ""} ${f.autocomplete ? `autocomplete="${f.autocomplete}"` : ""} ${f.list ? `list="${f.list}"` : ""}
          placeholder="${esc(f.placeholder || "")}">`;
      }
      return `<label class="f"><span>${esc(f.label)}${f.required ? " *" : ""}</span>${input}${f.help ? `<span class="muted" style="font-size:.8rem">${esc(f.help)}</span>` : ""}</label>`;
    }).join("") + `<div id="form-error" class="errors hidden"></div>
      <div class="btns"><button class="btn" value="cancel" formnovalidate>Cancelar</button>
      <button class="btn primary" value="ok">${esc(submitLabel)}</button></div>`;
    form.onclick = null; form.oninput = null;
    form.onsubmit = (ev) => {
      if (ev.submitter?.value !== "ok") return;
      const fd = new FormData(form);
      const data = {};
      for (const f of fields) {
        if (f.type === "checkbox") data[f.name] = fd.get(f.name) === "on";
        else if (f.type === "number") data[f.name] = fd.get(f.name) === "" ? null : num(fd.get(f.name));
        else if (f.type === "password") data[f.name] = fd.get(f.name) ?? "";
        else data[f.name] = (fd.get(f.name) ?? "").trim();
      }
      const err = fields.map((f) => f.validate?.(data[f.name], data)).filter(Boolean);
      if (err.length) {
        ev.preventDefault();
        const box = $("#form-error", form);
        box.innerHTML = err.map(esc).join("<br>"); box.classList.remove("hidden");
        return;
      }
      dlg.returnData = data;
    };
    dlg.returnData = null;
    dlg.onclose = () => resolve(dlg.returnData);
    dlg.showModal();
    form.querySelector("input:not([type=checkbox]), select")?.focus();
  });
}

function showDialog(html, onReady) {
  const dlg = $("#modal"), form = $("#modal-form");
  form.innerHTML = html;
  form.onsubmit = null; form.onclick = null; form.oninput = null;
  dlg.returnData = null; dlg.returnValue = ""; dlg.next = null;
  dlg.onclose = null;
  dlg.showModal();
  onReady?.(form, dlg);
}

// Cierra el diálogo y espera su evento "close" (si no, ese evento llega tarde y cancela el siguiente diálogo).
const closeModal = (dlg) => new Promise((r) => { dlg.addEventListener("close", () => r(), { once: true }); dlg.close(); });

const emailOk = (v) => !v || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) ? null : "El correo no tiene un formato válido.";

// ---------- login ----------
let loginMode = "token";
function setLoginMode(mode) {
  loginMode = mode;
  $("#login-user-wrap").classList.toggle("hidden", mode === "key");
  $("#login-pass-label").textContent = mode === "key" ? "Clave maestra" : "Contraseña";
  $("#login-hint").textContent = mode === "key"
    ? "Solo para el dueño: crear usuarios o recuperar el acceso."
    : "Entra con tu usuario y contraseña.";
  $("#login-mode").textContent = mode === "key" ? "Entrar con usuario y contraseña" : "Entrar con la clave maestra (dueño)";
}
$("#login-mode").addEventListener("click", () => { setLoginMode(loginMode === "key" ? "token" : "key"); showLoginError(""); });

function showLoginError(msg) {
  const box = $("#login-error");
  box.textContent = msg; box.classList.toggle("hidden", !msg);
}

function showLogin(msg = "") {
  $("#app").classList.add("hidden");
  $("#login").classList.remove("hidden");
  showLoginError(msg);
  $("#login-pass").value = "";
  (loginMode === "key" ? $("#login-pass") : $("#login-user")).focus();
}

function logout(msg = "") {
  if (auth?.mode === "token") fetch("api/logout", { method: "POST", headers: authHeaders() }).catch(() => {});
  auth = null; storageSet(null); currentTab = null; showLogin(msg);
}

$("#login-form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const btn = ev.submitter; btn.disabled = true;
  try {
    const pass = $("#login-pass").value;
    let candidate;
    if (loginMode === "key") {
      const r = await fetch("api/me", { headers: { "X-API-Key": pass.trim() } });
      if (r.status === 401) return showLogin("La clave maestra no es correcta.");
      if (!r.ok) return showLogin("El servidor respondió con un error. Intenta de nuevo.");
      candidate = { mode: "key", secret: pass.trim(), user: await r.json() };
    } else {
      const r = await fetch("api/login", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: $("#login-user").value.trim(), password: pass }) });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) return showLogin(data.error || "No se pudo entrar. Intenta de nuevo.");
      candidate = { mode: "token", secret: data.token, user: data.user };
    }
    auth = candidate; storageSet(auth);
    await startApp();
  } catch {
    showLogin("No se pudo conectar con el servidor. Revisa tu conexión a internet.");
  } finally { btn.disabled = false; }
});

$("#logout").addEventListener("click", () => logout());
$("#me").addEventListener("click", async () => {
  if (auth.mode === "key") return toast("Entraste con la clave maestra. Para cambiarla hay que editar el servidor.");
  const data = await openForm("Cambiar mi contraseña", [
    { name: "current_password", label: "Contraseña actual", type: "password", required: true, autocomplete: "current-password" },
    { name: "new_password", label: "Contraseña nueva", type: "password", required: true, autocomplete: "new-password",
      validate: (v) => v.length >= 6 ? null : "La contraseña nueva debe tener al menos 6 caracteres." },
    { name: "confirm", label: "Repite la contraseña nueva", type: "password", required: true, autocomplete: "new-password",
      validate: (v, d) => v === d.new_password ? null : "Las contraseñas nuevas no coinciden." },
  ], {}, "Cambiar", `<p class="muted">Se cerrará la sesión en tus otros dispositivos.</p>`);
  if (data) guarded(async () => { await api("POST", "api/me/password", data); toast("Contraseña cambiada."); });
});

async function startApp() {
  auth.user = await api("GET", "api/me");
  storageSet(auth);
  $("#login").classList.add("hidden");
  $("#app").classList.remove("hidden");
  $("#me").textContent = `${auth.user.name}${isAdmin() ? " · admin" : ""}`;
  $("#tabs").innerHTML = ALL_TABS.filter(([, , adminOnly]) => !adminOnly || isAdmin())
    .map(([key, label]) => `<button data-tab="${key}">${esc(label)}</button>`).join("");
  await loadCompany();
  go(currentTab && (isAdmin() || !ALL_TABS.find((t) => t[0] === currentTab)[2]) ? currentTab : (isAdmin() ? "resumen" : "factura"));
}

async function loadCompany() {
  company = await api("GET", "api/company");
  $("#company-title").textContent = company.name || "Facturador";
  document.title = company.name ? `${company.name} · Facturador` : "Facturador";
}

// ---------- navegación ----------
const views = {};
$("#tabs").addEventListener("click", (ev) => { const t = ev.target.closest("button")?.dataset.tab; if (t) go(t); });

async function go(tab) {
  currentTab = tab;
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("active", b.dataset.tab === tab));
  $(`#tabs button[data-tab="${tab}"]`)?.scrollIntoView({ inline: "nearest", block: "nearest" });
  const view = $("#view");
  view.innerHTML = `<p class="muted">Cargando…</p>`;
  window.scrollTo(0, 0);
  try { await views[tab](view); }
  catch (e) { view.innerHTML = `<div class="errors">${esc(e.message)}</div>`; }
}

function searchable(view, renderList) {
  const input = $("input[type=search]", view);
  input.addEventListener("input", () => renderList(input.value.trim().toLowerCase()));
  renderList("");
}

async function downloadBlob(path, name, type) {
  const r = await api("GET", path, undefined, { raw: true });
  const blob = await r.blob();
  const file = new File([blob], name, { type });
  // En el celular, ofrece compartir (WhatsApp, correo…) si el navegador lo permite.
  if (type === "application/pdf" && navigator.canShare?.({ files: [file] }) && matchMedia("(pointer: coarse)").matches) {
    try { await navigator.share({ files: [file], title: name }); return; }
    catch (e) { if (e.name === "AbortError") return; }
  }
  const url = URL.createObjectURL(blob);
  const a = Object.assign(document.createElement("a"), { href: url, download: name });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
const downloadPdf = (inv) => downloadBlob(`api/invoices/${inv.id}/pdf`, `${inv.number}.pdf`, "application/pdf");

// ---------- resumen (administrador) ----------
function rangeFor(preset) {
  const now = new Date(), d0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const day = 86400000;
  switch (preset) {
    case "hoy": return [d0, new Date(+d0 + day)];
    case "7d": return [new Date(+d0 - 6 * day), new Date(+d0 + day)];
    case "30d": return [new Date(+d0 - 29 * day), new Date(+d0 + day)];
    case "mes": return [new Date(now.getFullYear(), now.getMonth(), 1), new Date(now.getFullYear(), now.getMonth() + 1, 1)];
    case "mespasado": return [new Date(now.getFullYear(), now.getMonth() - 1, 1), new Date(now.getFullYear(), now.getMonth(), 1)];
    case "anio": return [new Date(now.getFullYear(), 0, 1), new Date(now.getFullYear() + 1, 0, 1)];
  }
}
const PRESETS = [["hoy", "Hoy"], ["7d", "7 días"], ["30d", "30 días"], ["mes", "Este mes"], ["mespasado", "Mes pasado"], ["anio", "Este año"]];

function niceMax(v) {
  if (v <= 0) return 1;
  const p = 10 ** Math.floor(Math.log10(v)), n = v / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
}
const shortMoney = (v) => {
  const a = Math.abs(v);
  return a >= 1e9 ? (v / 1e9).toFixed(1).replace(/\.0$/, "") + "MM" : a >= 1e6 ? (v / 1e6).toFixed(1).replace(/\.0$/, "") + "M"
    : a >= 1e3 ? (v / 1e3).toFixed(0) + "k" : String(Math.round(v));
};

function barChart(points, unit) {
  // Una sola serie: barras finas con punta redondeada, eje recesivo y tooltip al pasar o tocar.
  const W = 640, H = 220, L = 44, R = 8, T = 10, B = 24;
  const max = niceMax(Math.max(0, ...points.map((p) => p.total)));
  const n = Math.max(points.length, 1), slot = (W - L - R) / n, bw = Math.max(2, Math.min(28, slot - 2));
  const y = (v) => T + (H - T - B) * (1 - v / max);
  const label = (p) => unit === "month"
    ? new Date(p.date + "-01T12:00").toLocaleDateString("es", { month: "short", year: "2-digit" })
    : new Date(p.date + "T12:00").toLocaleDateString("es", { day: "numeric", month: "short" });
  const every = Math.ceil(n / 7);
  const ticks = [0, max / 2, max];
  let s = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Ventas por ${unit === "month" ? "mes" : "día"}"><g class="grid">`;
  for (const t of ticks) s += `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/>`;
  s += `</g>`;
  for (const t of ticks) s += `<text x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${shortMoney(t)}</text>`;
  points.forEach((p, i) => {
    const x = L + i * slot + (slot - bw) / 2, h = Math.max(0, (H - B) - y(p.total)), r = Math.min(4, bw / 2, h);
    const top = (H - B) - h;
    const path = h <= 0 ? "" : `M${x},${H - B}V${top + r}Q${x},${top} ${x + r},${top}H${x + bw - r}Q${x + bw},${top} ${x + bw},${top + r}V${H - B}Z`;
    s += `<rect class="hit" data-i="${i}" x="${L + i * slot}" y="${T}" width="${slot}" height="${H - T - B}" fill="transparent"/>`;
    s += `<path class="bar" data-i="${i}" d="${path}"/>`;
    if (i % every === 0) s += `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle">${esc(label(p))}</text>`;
  });
  s += `</svg><div class="tip hidden"></div>`;
  const wrap = document.createElement("div");
  wrap.className = "chart"; wrap.innerHTML = s;
  const tip = $(".tip", wrap), svg = $("svg", wrap);
  const show = (i) => {
    wrap.querySelectorAll(".bar").forEach((b) => b.classList.toggle("on", b.dataset.i === String(i)));
    const p = points[i], rect = svg.getBoundingClientRect(), sx = rect.width / W;
    tip.innerHTML = `<b>${esc(label(p))}</b> · ${esc(money(p.total))} · ${p.count} factura${p.count === 1 ? "" : "s"}`;
    tip.style.left = `${Math.min(Math.max((L + i * slot + slot / 2) * sx, 90), rect.width - 90)}px`;
    tip.style.top = `${y(p.total) * (rect.height / H)}px`;
    tip.classList.remove("hidden");
  };
  const hide = () => { tip.classList.add("hidden"); wrap.querySelectorAll(".bar.on").forEach((b) => b.classList.remove("on")); };
  svg.addEventListener("pointermove", (e) => { const i = e.target.dataset?.i; if (i !== undefined) show(+i); });
  svg.addEventListener("pointerdown", (e) => { const i = e.target.dataset?.i; if (i !== undefined) show(+i); });
  svg.addEventListener("pointerleave", (e) => { if (e.pointerType === "mouse") hide(); });
  return wrap;
}

// Número para WhatsApp: si no trae indicativo de país se le agrega el de la empresa (57 = Colombia).
function waLink(phone, message) {
  const raw = String(phone || "").trim();
  let digits = raw.replace(/\D/g, "");
  if (digits && !raw.startsWith("+") && digits.length <= 10) digits = (company.phone_country || "57") + digits.replace(/^0+/, "");
  return `https://wa.me/${digits}?text=${encodeURIComponent(message)}`;
}

// Abre la ventana antes de esperar al servidor: si no, el celular la bloquea como ventana emergente.
async function openWhatsApp(buildLink) {
  const w = window.open("", "_blank");
  try {
    const link = await buildLink();
    if (w) w.location.href = link; else location.href = link;
  } catch (e) {
    if (w) w.close();
    throw e;
  }
}

async function shareInvoiceWhatsApp(inv) {
  await openWhatsApp(async () => {
    const r = await api("POST", `api/invoices/${inv.id}/share`);
    const name = (inv.client_name || "").split(" ")[0];
    const msg = `Hola${name ? " " + name : ""}, te enviamos tu factura ${inv.number} de ${company.name || "nuestro negocio"} por ${money(inv.total)}.\n` +
      `Puedes verla y descargarla aquí: ${location.origin}${r.path}\n¡Gracias por tu compra!`;
    return waLink(inv.client_phone, msg);
  });
}

const CLIENT_FIELDS = [
  { name: "name", label: "Nombre / razón social", required: true },
  { name: "doc", label: "Documento (NIT / CC)" },
  { name: "address", label: "Dirección" },
  { name: "phone", label: "Teléfono / WhatsApp", type: "tel", help: "Con este número se envían las facturas y recordatorios por WhatsApp." },
  { name: "email", label: "Correo", type: "email", validate: emailOk },
];

async function editClient(c = {}) {
  const data = await openForm(c.id ? "Editar cliente" : "Nuevo cliente", CLIENT_FIELDS, c);
  if (!data) return null;
  return guarded(async () => {
    if (c.id) { await api("PUT", `api/clients/${c.id}`, data); toast("Cliente actualizado."); return { ...c, ...data }; }
    const r = await api("POST", "api/clients", data); toast("Cliente creado."); return { ...data, id: r.id };
  });
}

async function clientStatement(client) {
  const st = await api("GET", `api/clients/${client.id}/statement`);
  const s = st.summary, c = st.client;
  showDialog(`<h2>Estado de cuenta</h2>
    <p class="muted" style="margin-top:-8px">${esc(c.name)}${c.doc ? " · " + esc(c.doc) : ""}${c.phone ? " · " + esc(c.phone) : ""}</p>
    <div class="totals"><div><span>Total comprado</span><span class="money">${esc(money(s.total))}</span></div>
      <div><span>Pagado</span><span class="money">${esc(money(s.paid))}</span></div>
      <div class="grand"><span>Saldo pendiente</span><span class="money">${esc(money(s.balance))}</span></div></div>
    ${st.invoices.length ? `<table class="t"><thead><tr><th>Factura</th><th>Estado</th><th class="r">Saldo</th></tr></thead><tbody>
      ${st.invoices.slice().reverse().map((i) => `<tr><td>${esc(i.number)}<div class="muted" style="font-size:.8rem">${esc(fmtDate(i.created_at))} · ${esc(money(i.total))}</div></td>
        <td>${badge(i.payment_status)}</td><td class="r money">${PENDING.includes(i.payment_status) ? esc(money(i.balance)) : "—"}</td></tr>`).join("")}</tbody></table>`
      : `<p class="muted">Este cliente todavía no tiene facturas.</p>`}
    <div class="btns" style="margin-top:14px">
      <button type="button" class="btn" data-act="pdf">PDF</button>
      ${s.balance > 0 ? `<button type="button" class="btn good" data-act="wa">Recordar por WhatsApp</button>` : ""}
      <button class="btn primary" value="close">Cerrar</button></div>`, (form) => {
    form.onclick = async (ev) => {
      const act = ev.target.dataset.act;
      if (act === "pdf") {
        ev.target.disabled = true;
        await guarded(() => downloadBlob(`api/clients/${c.id}/statement.pdf`, `Estado de cuenta - ${c.name}.pdf`, "application/pdf"));
        ev.target.disabled = false;
      }
      if (act === "wa") {
        const lines = s.pending.map((p) => `• ${p.number} (${fmtDate(p.created_at)}): ${money(p.balance)} — ${location.origin}/f/${p.public_token}`);
        const msg = `Hola ${c.name.split(" ")[0]}, te escribimos de ${company.name || "nuestro negocio"}. ` +
          `Te recordamos que tienes un saldo pendiente de ${money(s.balance)}:\n${lines.join("\n")}\n¡Gracias!`;
        guarded(() => openWhatsApp(async () => waLink(c.phone, msg)));
      }
    };
  });
}

views.clientes = async (view) => {
  const clients = await api("GET", "api/clients");
  const owed = clients.filter((c) => c.balance > 0).length;
  view.innerHTML = `<h2>Clientes</h2>
    <div class="toolbar"><input type="search" placeholder="Buscar cliente…"><button class="btn primary" id="add">+ Nuevo</button></div>
    <div class="chips" id="filters"><button class="chip active" data-f="todos">Todos</button><button class="chip" data-f="deben">Con saldo (${owed})</button></div>
    <div class="card"><ul class="list" id="list"></ul></div>`;
  let onlyOwed = false, lastQ = "";
  $("#add", view).onclick = async () => { if (await editClient()) go("clientes"); };
  const render = (q) => {
    lastQ = q;
    const rows = clients.filter((c) => (!onlyOwed || c.balance > 0) && [c.name, c.doc, c.phone, c.email].join(" ").toLowerCase().includes(q));
    $("#list", view).innerHTML = rows.length ? rows.map((c, i) => `<li><div class="main">
        <div class="title">${esc(c.name)}</div>
        <div class="muted">${esc([c.doc, c.phone, c.email].filter(Boolean).join(" · "))}</div>
        ${c.balance > 0 ? `<div style="margin-top:3px"><span class="badge pendiente">Debe <span class="money">${esc(money(c.balance))}</span></span></div>` : ""}</div>
        <div class="actions"><button class="btn small" data-st="${i}">Estado de cuenta</button><button class="btn small" data-edit="${i}">Editar</button>
        ${isAdmin() ? `<button class="btn small danger" data-del="${i}">Eliminar</button>` : ""}</div></li>`).join("")
      : `<li class="empty">${clients.length ? "Sin resultados." : "Aún no hay clientes."}</li>`;
    $("#list", view).onclick = async (ev) => {
      const e = ev.target.dataset;
      if (e.st) guarded(() => clientStatement(rows[e.st]));
      if (e.edit) { if (await editClient(rows[e.edit])) go("clientes"); }
      if (e.del && confirm(`¿Eliminar a ${rows[e.del].name}? Sus facturas no se borran.`)) {
        await guarded(async () => { await api("DELETE", `api/clients/${rows[e.del].id}`); toast("Cliente eliminado."); go("clientes"); });
      }
    };
  };
  $("#filters", view).onclick = (ev) => {
    const f = ev.target.dataset.f; if (!f) return;
    onlyOwed = f === "deben";
    view.querySelectorAll("#filters .chip").forEach((c) => c.classList.toggle("active", c.dataset.f === f));
    render(lastQ);
  };
  searchable(view, render);
};

  const [products, suppliers] = await Promise.all([api("GET", "api/products"), admin ? api("GET", "api/suppliers") : []]);
  const cats = categoriesOf(products);
  if (productCategory && !cats.includes(productCategory) && productCategory !== "__none") productCategory = "";
  const fields = [
    { name: "name", label: "Nombre", required: true },
    { name: "category", label: "Categoría", placeholder: "ej. Herramientas", list: "cat-list" },
    { name: "price", label: `Precio de venta (${company.currency || "$"})`, type: "number", required: true,
      validate: (v) => v > 0 ? null : "El precio debe ser mayor que cero." },
    { name: "cost_price", label: "Precio de costo", type: "number", default: 0, help: "Se actualiza solo al registrar compras. Se usa para la ganancia.",
      validate: (v) => v === null || v >= 0 ? null : "El costo no puede ser negativo." },
    { name: "stock_qty", label: "Existencias (stock)", type: "number", default: 0, help: "Para mercancía que llega, mejor usa Compras: suma el stock y actualiza el costo.",
      validate: (v) => v === null || v >= 0 ? null : "Las existencias no pueden ser negativas." },
    { name: "unit", label: "Unidad", placeholder: "unidad, hora, caja…", default: "unidad" },
    { name: "supplier_id", label: "Proveedor habitual", type: "select",
      options: [{ value: "", label: "— sin proveedor —" }, ...suppliers.map((s) => ({ value: s.id, label: s.name }))] },
  ];
  view.innerHTML = `<h2>Productos</h2>${categoryDatalist("cat-list", cats)}
    <div class="toolbar"><input type="search" placeholder="Buscar producto…">${admin ? `<button class="btn primary" id="add">+ Nuevo</button>` : ""}</div>
    ${cats.length ? `<div class="chips" id="cats"><button class="chip" data-c="">Todas</button>${cats.map((c) =>
      `<button class="chip" data-c="${esc(c)}">${esc(c)}</button>`).join("")}<button class="chip" data-c="__none">Sin categoría</button></div>` : ""}
    <div class="card"><ul class="list" id="list"></ul></div>`;
  const edit = async (p = {}) => {
    const data = await openForm(p.id ? "Editar producto" : "Nuevo producto", fields, p);
    if (!data) return;
    data.unit = data.unit || "unidad"; data.stock_qty ??= 0; data.cost_price ??= 0;
    await guarded(async () => {
      if (p.id) await api("PUT", `api/products/${p.id}`, data); else await api("POST", "api/products", data);
      toast("Producto guardado."); go("productos");
    });
  };
  const restock = async (p) => {
    const data = await openForm(`Ajustar stock: ${p.name}`, [
      { name: "qty", label: `Cantidad que se suma (hay ${fmtNum(p.stock_qty)})`, type: "number", required: true,
        validate: (v) => v > 0 ? null : "La cantidad debe ser mayor que cero." },
      { name: "note", label: "Motivo", placeholder: "ej. conteo de inventario" },
    ], {}, "Sumar al stock", `<div class="note">Si es mercancía comprada a un proveedor, regístrala en <b>Compras</b>: así queda el costo y lo que le debes.</div>`);
    if (!data) return;
    await guarded(async () => { await api("POST", `api/products/${p.id}/restock`, data); toast("Stock actualizado."); go("productos"); });
  };
  if (admin) $("#add", view).onclick = () => edit({ category: productCategory && productCategory !== "__none" ? productCategory : "" });
  let lastQ = "";
  const render = (q) => {
    lastQ = q;
    view.querySelectorAll("#cats .chip").forEach((c) => c.classList.toggle("active", c.dataset.c === productCategory));
    const rows = products.filter((p) => (!productCategory || (productCategory === "__none" ? !p.category : p.category === productCategory))
      && [p.name, p.supplier_name, p.category].join(" ").toLowerCase().includes(q));
    $("#list", view).innerHTML = rows.length ? rows.map((p, i) => `<li><div class="main">
        <div class="title">${esc(p.name)} ${p.category ? `<span class="badge">${esc(p.category)}</span>` : ""}</div>
        <div class="muted"><span class="money">${esc(money(p.price))}</span> / ${esc(p.unit || "unidad")}
          · <span class="badge ${(p.stock_qty || 0) <= 0 ? "low" : ""}">Stock: ${fmtNum(p.stock_qty)}</span>
          ${admin ? ` · costo <span class="money">${esc(money(p.cost_price))}</span>` : ""}${p.supplier_name ? " · " + esc(p.supplier_name) : ""}</div></div>
        ${admin ? `<div class="actions"><button class="btn small" data-restock="${i}">Ajustar stock</button>
        <button class="btn small" data-edit="${i}">Editar</button>
        <button class="btn small danger" data-del="${i}">Eliminar</button></div>` : ""}</li>`).join("")
      : `<li class="empty">${products.length ? "Sin resultados." : "Aún no hay productos."}</li>`;
    $("#list", view).onclick = async (ev) => {
      const e = ev.target.dataset;
      if (e.edit) edit(rows[e.edit]);
      if (e.restock) restock(rows[e.restock]);
      if (e.del && confirm(`¿Eliminar ${rows[e.del].name}?`)) {
        await guarded(async () => { await api("DELETE", `api/products/${rows[e.del].id}`); toast("Producto eliminado."); go("productos"); });
      }
    };
  };
  const catsEl = $("#cats", view);
  if (catsEl) catsEl.onclick = (ev) => { if (ev.target.dataset.c !== undefined) { productCategory = ev.target.dataset.c; render(lastQ); } };
  searchable(view, render);
};

// Selector de producto agrupado por categoría (para facturas y compras).
function productSelectOptions(products, sel, { disableEmpty = false } = {}) {
  const groups = {};
  for (const p of products) (groups[p.category || ""] ||= []).push(p);
  const opt = (p) => `<option value="${esc(p.id)}" ${p.id === sel ? "selected" : ""} ${disableEmpty && (p.stock_qty || 0) <= 0 && p.id !== sel ? "disabled" : ""}>${esc(p.name)} (stock: ${fmtNum(p.stock_qty)})</option>`;
  const names = Object.keys(groups).sort((a, b) => (a === "") - (b === "") || a.localeCompare(b));
  return `<option value="">— elegir producto —</option>` + (names.length === 1 && names[0] === "" ? groups[""].map(opt).join("")
    : names.map((n) => `<optgroup label="${esc(n || "Sin categoría")}">${groups[n].map(opt).join("")}</optgroup>`).join(""));
}

let comprasSupplier = null;
const PURCHASE_FILTERS = [["todas", "Todas"], ["por_pagar", "Por pagar"], ["pagada", "Pagadas"], ["anulada", "Anuladas"]];
let comprasFilter = "todas";

      ${p.user_name ? `<br>Registrada por ${esc(p.user_name)}` : ""}</p>
    ${p.status === "anulada" ? `<div class="errors">Anulada el ${esc(fmtDateTime(p.voided_at))}${p.voided_by ? ` por ${esc(p.voided_by)}` : ""}: ${esc(p.void_reason)}</div>` : ""}
    <table class="t"><thead><tr><th>Producto</th><th class="r">Cant.</th><th class="r">Costo</th><th class="r">Total</th></tr></thead><tbody>
      ${p.items.map((it) => `<tr><td>${esc(it.description)}</td><td class="r">${fmtNum(it.qty)}</td><td class="r money">${esc(money(it.unit_cost))}</td>
        <td class="r money">${esc(money(it.qty * it.unit_cost))}</td></tr>`).join("")}</tbody></table>
    <div class="totals"><div><span>Total</span><span class="money">${esc(money(p.total))}</span></div>
      <div><span>Pagado</span><span class="money">${esc(money(p.paid))}</span></div>
      <div class="grand"><span>Le debes</span><span class="money">${esc(money(p.balance))}</span></div></div>
    <h3>Pagos al proveedor</h3>
    ${p.payments.length ? `<table class="t"><tbody>${p.payments.map((x) => `<tr><td>${esc(fmtDateTime(x.created_at))}<div class="muted" style="font-size:.8rem">
      ${esc(METHOD_LABEL[x.method] || x.method)}${x.user_name ? ` · ${esc(x.user_name)}` : ""}${x.note ? ` · ${esc(x.note)}` : ""}</div></td>
      <td class="r money">${esc(money(x.amount))}</td></tr>`).join("")}</tbody></table>` : `<p class="muted">Sin pagos todavía.</p>`}
    ${p.notes ? `<p class="muted">Notas: ${esc(p.notes)}</p>` : ""}
    <div class="btns" style="margin-top:14px">
      ${p.status !== "anulada" && p.balance > 0 ? `<button type="button" class="btn good" data-act="pay">Registrar pago</button>` : ""}
      ${p.status !== "anulada" ? `<button type="button" class="btn danger" data-act="void">Anular</button>` : ""}
      <button class="btn primary" value="close">Cerrar</button></div>`, (form, dlg) => {
    form.onclick = async (ev) => {
      const act = ev.target.dataset.act;
      if (act === "pay") {
        await closeModal(dlg);
        const data = await openForm(`Pago a ${p.supplier_name}`, [
          { name: "amount", label: "Monto pagado", type: "number", required: true, default: p.balance,
            validate: (v) => v > 0 ? null : "El monto debe ser mayor que cero." },
          { name: "method", label: "Método de pago", type: "select", options: PAYMENT_METHODS.map(([value, label]) => ({ value, label })) },
          { name: "note", label: "Nota (opcional)" },
        ], {}, "Registrar pago", `<p class="muted">${esc(p.number)} · Le debes <b>${esc(money(p.balance))}</b></p>`);
        if (data) await guarded(async () => { await api("POST", `api/purchases/${p.id}/payments`, data); toast("Pago registrado."); });
        go("compras");
      }
      if (act === "void") {
        await closeModal(dlg);
        const data = await openForm(`Anular ${p.number}`, [{ name: "reason", label: "Motivo", required: true }], {}, "Anular compra",
          `<div class="note">Se resta del inventario lo que entró con esta compra. El costo promedio de los productos no se recalcula.</div>`);
        if (data) await guarded(async () => { await api("POST", `api/purchases/${p.id}/void`, data); toast("Compra anulada."); });
        go("compras");
      }
    };
  });
}

function purchaseForm(view, products, suppliers) {
  const state = { lines: [] };
  const byId = Object.fromEntries(products.map((p) => [p.id, p]));
  view.innerHTML = `<h2>Nueva compra</h2>
    <p class="muted">Registra la mercancía que llega: el stock sube y el costo de cada producto se actualiza (promedio).</p>
    <div id="errors" class="errors hidden"></div>
    <div class="card"><div class="grid2">
      <label class="f"><span>Proveedor *</span><select id="supplier"><option value="">— elegir proveedor —</option>${suppliers.map((s) =>
        `<option value="${esc(s.id)}" ${comprasSupplier?.id === s.id ? "selected" : ""}>${esc(s.name)}</option>`).join("")}</select></label>
      <label class="f"><span>N.º de factura del proveedor (opcional)</span><input id="ref"></label></div>
      ${suppliers.length ? "" : `<p class="muted">Primero crea el proveedor en la pestaña Proveedores.</p>`}</div>
    <div class="card"><div class="muted" style="margin-bottom:8px">Productos que llegan</div><div id="lines"></div>
      <button class="btn" id="add-line">+ Añadir producto</button></div>
    <div class="card">
      <label class="f"><span>Notas (opcional)</span><input id="notes"></label>
      <div class="totals"><div class="grand"><span>Total de la compra</span><span class="money" id="total"></span></div></div>
      <div class="muted" style="margin-bottom:6px">Forma de pago</div>
      <div class="seg"><label><input type="radio" name="paymode" value="contado" checked>Pagada ahora</label>
        <label><input type="radio" name="paymode" value="credito">A crédito</label></div>
      <div class="grid2"><label class="f"><span>Método de pago</span><select id="paymethod">${methodOptions()}</select></label>
        <label class="f hidden" id="abono-wrap"><span>Abono inicial (opcional)</span><input id="abono" type="number" step="any" inputmode="decimal" placeholder="0"></label></div>
      <div class="btns"><button class="btn" id="cancel">Cancelar</button><button class="btn primary" id="save">Registrar compra</button></div>
    </div>`;
  let total = 0;
  const recalc = () => {
    total = 0;
    state.lines.forEach((l, i) => {
      const t = (num(l.qty) || 0) * (num(l.cost) || 0); total += t;
      const el = $(`.line-item[data-i="${i}"] [data-total]`, view); if (el) el.textContent = money(t);
    });
    $("#total", view).textContent = money(total);
  };
  const renderLines = () => {
    $("#lines", view).innerHTML = state.lines.map((l, i) => `<div class="line-item" data-i="${i}">
      <label class="f"><span>Producto</span><select data-k="productId">${productSelectOptions(products, l.productId)}</select></label>
      <div class="nums" style="grid-template-columns:1fr 1.4fr">
        <label class="f"><span>Cantidad</span><input data-k="qty" type="number" step="any" inputmode="decimal" value="${esc(l.qty)}"></label>
        <label class="f"><span>Costo unitario</span><input data-k="cost" type="number" step="any" inputmode="decimal" value="${esc(l.cost)}"></label></div>
      <div class="foot"><span class="money" data-total></span><button class="btn small danger" data-remove>Quitar</button></div></div>`).join("");
    recalc();
  };
  const addLine = () => { state.lines.push({ productId: "", qty: "1", cost: "" }); renderLines(); };
  $("#lines", view).addEventListener("input", (ev) => {
    const box = ev.target.closest(".line-item"); const k = ev.target.dataset.k; if (!box || !k) return;
    const line = state.lines[box.dataset.i]; line[k] = ev.target.value;
    if (k === "productId") { line.cost = byId[line.productId] ? String(byId[line.productId].cost_price || "") : ""; $('[data-k="cost"]', box).value = line.cost; }
    recalc();
  });
  $("#lines", view).addEventListener("click", (ev) => {
    if (!ev.target.matches("[data-remove]")) return;
    state.lines.splice(ev.target.closest(".line-item").dataset.i, 1);
    if (!state.lines.length) addLine(); else renderLines();
  });
  $("#add-line", view).onclick = addLine;
  const payMode = () => $("input[name=paymode]:checked", view).value;
  view.querySelectorAll("input[name=paymode]").forEach((r) => r.onchange = () => $("#abono-wrap", view).classList.toggle("hidden", payMode() !== "credito"));
  $("#cancel", view).onclick = () => go("compras");
  $("#save", view).onclick = async (ev) => {
    const errors = [];
    const supplier_id = $("#supplier", view).value;
    if (!supplier_id) errors.push("Elige el proveedor.");
    const items = state.lines.filter((l) => l.productId).map((l) => ({ product_id: l.productId, qty: num(l.qty), unit_cost: num(l.cost) }));
    if (!items.length) errors.push("Añade al menos un producto.");
    items.forEach((it) => {
      const n = byId[it.product_id].name;
      if (!(it.qty > 0)) errors.push(`En "${n}": la cantidad debe ser mayor que cero.`);
      if (it.unit_cost === null || it.unit_cost < 0) errors.push(`En "${n}": escribe el costo unitario.`);
    });
    const payment = { mode: payMode(), method: $("#paymethod", view).value };
    if (payment.mode === "credito") {
      payment.amount = num($("#abono", view).value) ?? 0;
      if (payment.amount < 0 || payment.amount > total + 0.004) errors.push("El abono inicial debe estar entre 0 y el total.");
    }
    const box = $("#errors", view);
    box.innerHTML = errors.length ? `Revisa lo siguiente:<ul>${errors.map((e) => `<li>${esc(e)}</li>`).join("")}</ul>` : "";
    box.classList.toggle("hidden", !errors.length);
    if (errors.length) { window.scrollTo({ top: 0, behavior: "smooth" }); return; }
    ev.target.disabled = true;
    try {
      const r = await api("POST", "api/purchases", { supplier_id, supplier_ref: $("#ref", view).value.trim(), notes: $("#notes", view).value.trim(), items, payment });
      toast(`Compra ${r.number} registrada. El inventario ya se actualizó.`);
      comprasFilter = "todas"; go("compras");
    } catch (e) {
      box.innerHTML = esc(e.message); box.classList.remove("hidden"); window.scrollTo({ top: 0, behavior: "smooth" });
    } finally { ev.target.disabled = false; }
  };
  addLine();
}

views.compras = async (view) => {
  const [purchases, products, suppliers] = await Promise.all([api("GET", "api/purchases"), api("GET", "api/products"), api("GET", "api/suppliers")]);
  const owed = purchases.reduce((a, p) => a + p.balance, 0);
  view.innerHTML = `<h2>Compras a proveedores</h2>
    <div class="toolbar"><input type="search" placeholder="Buscar por número o proveedor…"><button class="btn primary" id="add">+ Nueva compra</button></div>
    ${comprasSupplier ? `<div class="note">Mostrando solo las compras a <b>${esc(comprasSupplier.name)}</b>. <button class="linkbtn" id="all">Ver todas</button></div>` : ""}
    <div class="chips" id="filters">${PURCHASE_FILTERS.map(([k, l]) => `<button class="chip ${k === comprasFilter ? "active" : ""}" data-f="${k}">${l}</button>`).join("")}</div>
    ${owed > 0 ? `<p class="muted">Les debes a tus proveedores: <b class="money">${esc(money(owed))}</b></p>` : ""}
    <div class="card"><ul class="list" id="list"></ul></div>`;
  $("#add", view).onclick = () => purchaseForm(view, products, suppliers);
  const all = $("#all", view); if (all) all.onclick = () => { comprasSupplier = null; go("compras"); };
  let lastQ = "";
  const render = (q) => {
    lastQ = q;
    const rows = purchases.filter((p) => (!comprasSupplier || p.supplier_id === comprasSupplier.id)
      && (comprasFilter === "todas" || (comprasFilter === "por_pagar" ? PENDING.includes(p.payment_status) : p.payment_status === comprasFilter))
      && [p.number, p.supplier_name, p.supplier_ref].join(" ").toLowerCase().includes(q));
    $("#list", view).innerHTML = rows.length ? rows.map((p, i) => `<li class="${p.status === "anulada" ? "voided" : ""}"><div class="main">
        <div class="title">${esc(p.number)} · ${esc(fmtDate(p.created_at))}</div>
        <div class="muted">${esc(p.supplier_name)} · <span class="money">${esc(money(p.total))}</span></div>
        <div style="margin-top:3px">${badge(p.payment_status)}${PENDING.includes(p.payment_status) ? ` <span class="muted" style="font-size:.85rem">le debes <span class="money">${esc(money(p.balance))}</span></span>` : ""}</div></div>
        <div class="actions"><button class="btn small" data-det="${i}">Detalle</button></div></li>`).join("")
      : `<li class="empty">${purchases.length ? "Sin resultados." : "Aún no hay compras registradas."}</li>`;
    $("#list", view).onclick = (ev) => { const i = ev.target.dataset.det; if (i !== undefined) guarded(() => purchaseDetail(rows[i].id)); };
  };
  $("#filters", view).onclick = (ev) => {
    const f = ev.target.dataset.f; if (!f) return;
    comprasFilter = f;
    view.querySelectorAll("#filters .chip").forEach((c) => c.classList.toggle("active", c.dataset.f === f));
    render(lastQ);
  };
  searchable(view, render);
};

  view.innerHTML = `<h2>Gastos</h2>${categoryDatalist("exp-cats", cats)}
    <p class="muted">${isAdmin() ? "Lo que el negocio paga: arriendo, servicios, nómina, transporte… Se restan de la ganancia en el Resumen."
      : "Registra aquí los gastos que pagues con dinero de la caja (transporte, papelería…). Se descuentan en tu cierre de caja."}</p>
    <div class="toolbar"><input type="month" id="month" value="${esc(gastosMonth)}" style="max-width:200px"><button class="btn primary" id="add">+ Nuevo gasto</button></div>
    <div class="tiles"><div class="tile"><div class="k">Total del mes</div><div class="v">${esc(money(total))}</div><div class="s">${expenses.length} gasto(s)</div></div></div>

      .map(([c, a]) => `<tr><td>${esc(c)}</td><td class="r money">${esc(money(a))}</td></tr>`).join("")}</tbody></table></div>` : ""}
    <div class="card"><ul class="list" id="list">${expenses.length ? expenses.map((e, i) => `<li><div class="main">

      <div class="muted">${esc(fmtDate(e.spent_at))} · ${esc(METHOD_LABEL[e.method] || e.method)}${e.description ? " · " + esc(e.description) : ""}
        ${e.supplier_name ? " · " + esc(e.supplier_name) : ""}${e.user_name ? " · " + esc(e.user_name) : ""}</div></div>
      ${isAdmin() ? `<div class="actions"><button class="btn small danger" data-del="${i}">Eliminar</button></div>` : ""}</li>`).join("")

  $("#month", view).onchange = (ev) => { if (ev.target.value) { gastosMonth = ev.target.value; go("gastos"); } };
  $("#add", view).onclick = async () => {
    const suppliers = isAdmin() ? await api("GET", "api/suppliers") : [];
    const data = await openForm("Nuevo gasto", [
      { name: "day", label: "Fecha", type: "date", required: true, default: localDay() },

    const [yy, mm, dd] = data.day.split("-").map(Number);
    const isToday = data.day === localDay();
    data.spent_at = isToday ? Date.now() / 1000 : new Date(yy, mm - 1, dd, 12) / 1000;
    delete data.day;
    guarded(async () => { await api("POST", "api/expenses", data); toast("Gasto registrado."); go("gastos"); });
  };
  $("#list", view).onclick = (ev) => {
    const i = ev.target.dataset.del;
    if (i !== undefined && confirm("¿Eliminar este gasto?")) guarded(async () => { await api("DELETE", `api/expenses/${expenses[i].id}`); toast("Gasto eliminado."); go("gastos"); });
  };
};

// ---------- cierre de caja ----------
let cajaDay = localDay(), cajaUser = "all";

views.caja = async (view) => {
  const admin = isAdmin();
  const tz = new Date().getTimezoneOffset();
  const [c, users, closings] = await Promise.all([
    api("GET", `api/cash?day=${cajaDay}&tz=${tz}&user_id=${encodeURIComponent(cajaUser)}`),
    admin ? api("GET", "api/users") : [], api("GET", "api/cash/closings")]);
  const rows = [["received", "Cobros de facturas", 1], ["refunded", "Dinero devuelto a clientes", -1],
    ["supplier_payments", "Pagos a proveedores", -1], ["expenses", "Gastos", -1]];
  const cell = (obj, m, sign) => { const v = obj[m] || 0; return v ? `${sign < 0 ? "−" : ""}${esc(money(v))}` : "—"; };
  const closed = c.closing;
  // En el celular no caben 4 columnas: solo se muestran los métodos que tuvieron movimiento (efectivo siempre).
  const used = PAYMENT_METHODS.filter(([m]) => m === "efectivo" || rows.some(([k]) => c[k][m]));
  view.innerHTML = `<h2>Cierre de caja</h2>
    <p class="muted">Compara lo que el sistema dice que debería haber con lo que realmente hay al final del día.</p>
    <div class="toolbar"><input type="date" id="day" value="${esc(cajaDay)}" style="max-width:190px">
      ${admin ? `<select id="who" style="max-width:240px"><option value="all">Todos</option>${users.filter((u) => u.active).map((u) =>
        `<option value="${esc(u.id)}" ${u.id === cajaUser ? "selected" : ""}>${esc(u.name)}</option>`).join("")}</select>` : `<span class="muted">Caja de ${esc(c.scope_name)}</span>`}</div>
    <div class="card"><h3>Movimientos del día · ${esc(c.scope_name)}</h3>
      <div style="overflow-x:auto"><table class="t"><thead><tr><th></th>${used.map(([, l]) => `<th class="r">${l}</th>`).join("")}</tr></thead><tbody>
        ${rows.filter(([k]) => used.some(([m]) => c[k][m])).map(([k, label, sign]) => `<tr><td>${label}</td>${used.map(([m]) => `<td class="r money">${cell(c[k], m, sign)}</td>`).join("")}</tr>`).join("")}
        <tr><td><b>Neto del día</b></td>${used.map(([m]) => `<td class="r money"><b>${esc(money(c.expected[m]))}</b></td>`).join("")}</tr>
      </tbody></table></div></div>
    ${closed ? `<div class="card"><h3>Caja cerrada ${closed.difference === 0 ? "✅" : "⚠️"}</h3>
      <p class="muted" style="margin-top:-6px">Por ${esc(closed.user_name)} el ${esc(fmtDateTime(closed.created_at))} · base ${esc(money(closed.opening_cash))}</p>
      <table class="t"><thead><tr><th></th><th class="r">Esperado</th><th class="r">Contado</th><th class="r">Diferencia</th></tr></thead><tbody>
        ${PAYMENT_METHODS.map(([m, l]) => { const dif = (closed.counted[m] || 0) - (closed.expected[m] || 0);
          return `<tr><td>${l}</td><td class="r money">${esc(money(closed.expected[m]))}</td><td class="r money">${esc(money(closed.counted[m]))}</td>
            <td class="r money ${dif < 0 ? "neg" : dif > 0 ? "pos" : ""}">${esc(money(dif))}</td></tr>`; }).join("")}</tbody></table>
      <div class="totals"><div class="grand"><span>${closed.difference === 0 ? "Cuadró" : closed.difference > 0 ? "Sobró" : "Faltó"}</span>
        <span class="money">${esc(money(Math.abs(closed.difference)))}</span></div></div>
      ${closed.notes ? `<p class="muted">Notas: ${esc(closed.notes)}</p>` : ""}
      ${admin ? `<button class="btn small danger" id="reopen">Borrar este cierre (para repetirlo)</button>` : ""}</div>`
    : `<form class="card" id="close-form"><h3>Contar y cerrar</h3>
      <label class="f"><span>Base de caja (efectivo con el que se abrió el día)</span><input name="opening_cash" type="number" step="any" inputmode="decimal" value="0"></label>
      <table class="t"><thead><tr><th></th><th class="r">Esperado</th><th class="r" style="width:42%">Contado</th></tr></thead><tbody>
        ${PAYMENT_METHODS.map(([m, l]) => `<tr><td>${l}</td><td class="r money" data-exp="${m}"></td>
          <td class="r"><input name="c_${m}" type="number" step="any" inputmode="decimal" placeholder="0" style="text-align:right"></td></tr>`).join("")}</tbody></table>
      <div class="totals"><div class="grand"><span id="dif-label">Diferencia</span><span class="money" id="dif"></span></div></div>
      <label class="f"><span>Notas (opcional)</span><input name="notes" placeholder="ej. se pagó un domicilio con la caja"></label>
      <div id="err" class="errors hidden"></div>
      <button class="btn primary block" type="submit">Guardar cierre de caja</button></form>`}
    <div class="card"><h3>Últimos cierres</h3>${closings.length ? `<table class="t"><thead><tr><th>Día</th><th>Caja</th><th class="r">Resultado</th></tr></thead><tbody>
      ${closings.map((x) => `<tr><td>${esc(x.day)}</td><td>${esc(x.scope_name)}<div class="muted" style="font-size:.8rem">por ${esc(x.user_name)}</div></td>
        <td class="r money ${x.difference < 0 ? "neg" : x.difference > 0 ? "pos" : ""}">${x.difference === 0 ? "Cuadró" : (x.difference > 0 ? "Sobró " : "Faltó ") + esc(money(Math.abs(x.difference)))}</td></tr>`).join("")}</tbody></table>`
      : `<p class="muted">Todavía no hay cierres.</p>`}</div>`;
  $("#day", view).onchange = (ev) => { if (ev.target.value) { cajaDay = ev.target.value; go("caja"); } };
  const who = $("#who", view); if (who) who.onchange = (ev) => { cajaUser = ev.target.value; go("caja"); };
  const reopen = $("#reopen", view);
  if (reopen) reopen.onclick = () => confirm("¿Borrar este cierre? Quedará registrado en Actividad.") &&
    guarded(async () => { await api("DELETE", `api/cash/closings/${closed.id}`); toast("Cierre borrado."); go("caja"); });
  const form = $("#close-form", view);
  if (!form) return;
  const expectedOf = () => {
    const base = num(form.opening_cash.value) || 0;
    return Object.fromEntries(PAYMENT_METHODS.map(([m]) => [m, (c.expected[m] || 0) + (m === "efectivo" ? base : 0)]));
  };
  const recalc = () => {
    const exp = expectedOf();
    let dif = 0;
    PAYMENT_METHODS.forEach(([m]) => { $(`[data-exp="${m}"]`, form).textContent = money(exp[m]); dif += (num(form[`c_${m}`].value) || 0) - exp[m]; });
    dif = Math.round(dif * 100) / 100;
    $("#dif-label", form).textContent = Math.abs(dif) < 0.005 ? "Cuadra" : dif > 0 ? "Sobra" : "Falta";
    $("#dif", form).textContent = money(Math.abs(dif));
  };
  form.oninput = recalc; recalc();
  form.onsubmit = async (ev) => {
    ev.preventDefault();
    const counted = Object.fromEntries(PAYMENT_METHODS.map(([m]) => [m, num(form[`c_${m}`].value) || 0]));
    const box = $("#err", view);
    if (Object.values(counted).some((v) => v < 0) || (num(form.opening_cash.value) || 0) < 0) {
      box.textContent = "Los valores no pueden ser negativos."; box.classList.remove("hidden"); return;
    }
    const btn = ev.submitter; btn.disabled = true;
    try {
      const r = await api("POST", "api/cash/closings", { day: cajaDay, tz, user_id: cajaUser, opening_cash: num(form.opening_cash.value) || 0,
        counted, notes: form.notes.value.trim() });
      toast(Math.abs(r.difference) < 0.005 ? "Caja cerrada: cuadró." : `Caja cerrada: ${r.difference > 0 ? "sobraron" : "faltaron"} ${money(Math.abs(r.difference))}.`, r.difference < 0);
      go("caja");
    } catch (e) { box.textContent = e.message; box.classList.remove("hidden"); }
    finally { btn.disabled = false; }
  };
};

// ---------- historial ----------
let historialFilter = "todas";
const FILTERS = [["todas", "Todas"], ["por_cobrar", "Por cobrar"], ["pagada", "Pagadas"], ["devolucion", "Con devolución"], ["anulada", "Anuladas"]];
const matchesFilter = (inv) => historialFilter === "todas" ? true
  : historialFilter === "por_cobrar" ? PENDING.includes(inv.payment_status)
  : historialFilter === "devolucion" ? inv.returned > 0
  : inv.payment_status === historialFilter;

async function registerPayment(inv) {
  const data = await openForm(`Registrar pago · ${inv.number}`, [
    { name: "amount", label: "Monto recibido", type: "number", required: true, default: inv.payment_tracking ? inv.balance : inv.total,
      validate: (v) => v > 0 ? null : "El monto debe ser mayor que cero." },
    { name: "method", label: "Método de pago", type: "select", options: PAYMENT_METHODS.map(([value, label]) => ({ value, label })) },
    { name: "note", label: "Nota (opcional)", placeholder: "ej. número de transferencia" },
  ], {}, "Registrar pago", `<p class="muted">${esc(inv.client_name)} · Total ${esc(money(inv.total))}${inv.payment_tracking ? ` · Saldo <b>${esc(money(inv.balance))}</b>` : ""}</p>`);
  if (!data) return false;
  return !!(await guarded(async () => { await api("POST", `api/invoices/${inv.id}/payments`, data); toast("Pago registrado."); return true; }));
}

async function voidInvoice(inv) {
  const data = await openForm(`Anular ${inv.number}`, [
    { name: "reason", label: "Motivo de la anulación", required: true, placeholder: "ej. error en el cliente…" },
  ], {}, "Anular factura", `<div class="note">La factura queda en el historial marcada como ANULADA (no se borra, para no
    dejar huecos en la numeración) y el stock de sus artículos vuelve al inventario. Si solo devuelven algunos artículos, usa <b>Devolución</b>. No se puede deshacer.</div>`);
  if (!data) return false;
  return !!(await guarded(async () => { await api("POST", `api/invoices/${inv.id}/void`, data); toast(`Factura ${inv.number} anulada.`); return true; }));
}

    showDialog(`<h2>Devolución · ${esc(inv.number)}</h2>
